name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Candidate (${{ matrix.platform }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - if: runner.os == 'macOS'
        run: native/bin/GaugeHostMac --self-test
      - name: Build Windows candidate
        if: runner.os == 'Windows'
        run: npm run build:win -- --publish never
      - name: Build Apple Silicon candidate
        if: runner.os == 'macOS'
        run: npm run build:mac -- --arm64 --publish never -c.mac.identity=- -c.mac.timestamp=none
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # PR candidates use only ad-hoc identity '-' above, never certificate secrets.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Verify Mac signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict 'dist/mac-arm64/Codex Gauge.app'
      - name: Save candidate installers (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.platform }}-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 7
  cross-platform:
    name: Cross-platform gate
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both platforms
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
